# Software environment (install with `pixi install`; locked versions in pixi.lock). Terms: docs/glossary.md
[workspace]
name = "rnaseq-aging"
channels = ["conda-forge", "bioconda"]
platforms = ["osx-arm64"]            # Apple-silicon Mac; add "linux-64" / "osx-64" to use another machine

[dependencies]
# QC reports and the adapter check (notebooks 01, 02). The heavy steps (FastQC, fastp, kallisto, STAR, RSEM) run on Euler:
# their versions are pinned in euler/00_setup.sh
multiqc = "*"                        # combines the FastQC reports
fastp = "*"                          # used by the adapter check in notebook 02

# Python side (notebooks 01, 02; scripts/helpers.py)
python = "3.12.*"
pandas = "*"
numpy = "*"
jupyterlab = "*"
nbconvert = "*"                      # run notebooks from the command line

# R side (notebooks 03, 04, 05; R/helpers.R)
r-base = "4.4.*"
r-irkernel = "*"                     # lets Jupyter / VS Code run R notebooks
r-tidyverse = "*"                    # data frames and plots (dplyr, ggplot2, ...)
r-ggrepel = "*"                      # non-overlapping plot labels
bioconductor-deseq2 = "*"            # differential expression
bioconductor-tximport = "*"          # transcript estimates -> gene counts
bioconductor-genomeinfodbdata = "*"  # data package DESeq2 needs
bioconductor-fgsea = "*"             # gene set enrichment analysis
r-msigdbr = "*"                      # MSigDB gene sets (Hallmark, GO)
matplotlib = ">=3.10.9,<4"
